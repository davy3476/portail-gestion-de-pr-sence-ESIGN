<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>index.html</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #1e40af; --secondary: #1d4ed8; --success: #16a34a; --danger: #dc2626; --glass: rgba(255, 255, 255, 0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background-image: linear-gradient(rgba(163, 190, 43, 0.932), rgba(15, 23, 42, 0.75)), url('https://images.unsplash.com/photo-1541339907198-e08756ebafe3?q=80&w=2070');
            background-size: cover; background-position: center; background-attachment: fixed; color: white; min-height: 100vh;
        }
        nav { background: rgba(255, 255, 255, 0.95); padding: 0.8rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 700; color: var(--primary); cursor: pointer; font-size: 1.1rem; }
        .hero { text-align: center; padding: 30px 10%; }
        .hero h1 { font-size: 1.3rem; text-transform: uppercase; margin-bottom: 15px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .main-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; padding: 10px 20px; }
        .card, .portal-card { background: var(--glass); backdrop-filter: blur(15px); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); max-width: 340px; margin: 0 auto; }
        .btn-main { padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; font-size: 0.8rem; transition: 0.3s; text-transform: uppercase; }
        .btn-reg { background: var(--primary); color: white; }
        .btn-log { background: rgba(255,255,255,0.1); color: white; border: 1px solid white; }
        .btn-pdf { background: var(--success); color: white; margin-bottom: 15px; }
        .btn-danger { background: var(--danger); color: white; }
        .page { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .active { display: block; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: none; font-size: 0.8rem; }
        .promo-section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid var(--primary); }
        .table-wrapper { overflow-x: auto; background: white; border-radius: 8px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; color: #333; min-width: 500px; }
        th, td { padding: 10px; text-align: left; font-size: 0.7rem; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; color: var(--primary); font-weight: 600; }
        
        /* ZONE CAMÉRA */
        #reader { width: 100%; max-width: 300px; margin: 15px auto; border-radius: 10px; overflow: hidden; display: none; border: 2px solid white; }
        #reader__status_span { color: #333 !important; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav><div class="logo" onclick="location.reload()">PORTAIL PRESENCE ESIGN SANGMÉLIMA</div><div id="nav-auth" style="display:none;"><button onclick="logout()" style="color:var(--danger); border:1px solid var(--danger); background:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Déconnexion</button></div></nav>

    <section id="home" class="page active">
        <div class="hero"><h1>BIENVENUE SUR LE PORTAIL DE GESTION DE PRÉSENCE DE L'ÉCOLE SUPERIEURE INTERNATIONALE DE GÉNIE NUMERIQUE DE SANGMÉLIMA</h1></div>
        <div class="main-menu">
            <div class="portal-card"><h3>Admin</h3><button class="btn-main btn-reg" onclick="openPortal('admin', 'reg')">S'inscrire</button><button class="btn-main btn-log" onclick="openPortal('admin', 'log')">Connexion</button></div>
            <div class="portal-card"><h3>Délégué</h3><button class="btn-main btn-reg" onclick="openPortal('delegue', 'reg')">S'inscrire</button><button class="btn-main btn-log" onclick="openPortal('delegue', 'log')">Connexion</button></div>
            <div class="portal-card"><h3>Étudiant</h3><button class="btn-main btn-reg" onclick="openPortal('etudiant', 'reg')">S'inscrire</button><button class="btn-main btn-log" onclick="openPortal('etudiant', 'log')">Connexion</button></div>
        </div>
    </section>

    <section id="register-page" class="page">
        <div class="card">
            <h3>Inscription</h3>
            <input type="text" id="reg-nom" placeholder="Nom complet">
            <input type="tel" id="reg-phone" placeholder="Téléphone (9 chiffres)" maxlength="9">
            <div id="admin-fields" style="display:none;"><input type="password" id="reg-univ-code" placeholder="Code Universel Admin"></div>
            <div id="user-fields" style="display:none;">
                <input type="text" id="reg-mat" placeholder="Matricule">
                <select id="reg-filiere"><option value="ISN"> INGÉNIERIE DES SYSTEMES NUMÉRIQUES</option><option value="INS">INGÉNIERIE NUMÉRIQUE SOCIOTECHNIQUE</option><option value="CDN">CRÉATION ET DESIGN NUMÉRIQUE</option></select>
                <select id="reg-promotion"><option value="2ème Promotion">2ème Promotion</option><option value="3ème Promotion">3ème Promotion</option></select>
                <input type="text" id="reg-access-code" placeholder="Code d'accès de l'école *">
            </div>
            <input type="text" id="reg-pass" placeholder="Pass (Ex: 1234AB)" maxlength="6">
            <button class="btn-main btn-reg" onclick="processRegistration()">Créer mon compte</button>
        </div>
    </section>

    <section id="login-page" class="page">
        <div class="card">
            <h3>Connexion</h3>
            <input type="tel" id="log-phone" placeholder="Téléphone" maxlength="9">
            <input type="password" id="log-pass" placeholder="Mot de passe">
            <button class="btn-main btn-reg" onclick="processLogin()">Accéder au portail</button>
        </div>
    </section>

    <section id="dash-admin" class="page">
        <div style="max-width:1000px; margin:0 auto;">
            <h2 style="margin-bottom:20px">Tableau de Bord Admin (LIVE)</h2>
            <div style="margin-bottom:20px; display:flex; gap:10px;">
                <button class="btn-main btn-reg" onclick="generateQR('PRESENCE')">Générer QR de Présence</button>
                <button class="btn-main btn-danger" onclick="if(confirm('Vider la base ?')) database.ref('attendance').remove();">Vider la base</button>
            </div>
            <div id="qr-result" style="text-align:center; margin-bottom:20px;"></div>
            <div id="admin-content"></div>
        </div>
    </section>

    <section id="dash-user" class="page">
        <div class="card">
            <h2 id="user-welcome">Bonjour</h2>
            <p id="user-info" style="font-size:0.8rem; margin-bottom:15px; color:#93c5fd;"></p>
            
            <button class="btn-main btn-reg" id="start-camera-btn" onclick="startCameraScan()">Ouvrir la Caméra pour Émarger</button>
            <div id="reader"></div>
            
            <div id="scan-success" style="display:none; color:var(--success); margin-top:10px; font-weight:bold; text-align:center;">✔ Présence et GPS synchronisés !</div>
            
            <div id="delegue-area" style="display:none; margin-top:20px; border-top:1px solid rgba(255,255,255,0.2); padding-top:10px;">
                <button class="btn-main btn-log" onclick="generateQR('CLASSE')">Générer QR Classe</button>
                <div id="qr-delegue" style="margin-top:10px; text-align:center;"></div>
            </div>
        </div>
    </section>

    <script>
        // CONFIGURATION FIREBASE VALIDÉE
        const firebaseConfig = {
            apiKey: "AIzaSyAF9WVUGPY569pZj3WG9Sd0dEKyp_IfgL8",
            authDomain: "suipp-9f755.firebaseapp.com",
            databaseURL: "https://suipp-9f755-default-rtdb.firebaseio.com",
            projectId: "suipp-9f755",
            storageBucket: "suipp-9f755.firebasestorage.app",
            messagingSenderId: "421457986063",
            appId: "1:421457986063:web:42723548c27eb7656ad97a"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // CODES DE SÉCURITÉ
        const UNIVERSAL_CODE = "ESIGN-ADMIN-2026"; 
        const CODE_ACCES_ETUDIANT = "SANGMELIMA-2026"; 
        const CODE_ACCES_DELEGUE = "DELEGUE-ESIGN-QR";

        let usersDB = [];
        let attendanceDB = [];
        let currentUser = JSON.parse(localStorage.getItem('loggedUser')) || null;
        let portalType = '';
        let html5QrCodeScanner = null; // Scanner caméra

        // ECOUTEURS FIREBASE (TEMPS RÉEL)
        database.ref('users').on('value', (snap) => { usersDB = snap.val() ? Object.values(snap.val()) : []; });
        database.ref('attendance').on('value', (snap) => { 
            attendanceDB = snap.val() ? Object.values(snap.val()) : []; 
            if(currentUser && currentUser.type === 'admin') renderAdminView();
        });

        window.onload = () => { if(currentUser) showDash(); };

        function logout() { localStorage.removeItem('loggedUser'); location.reload(); }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }

        function openPortal(type, action) {
            portalType = type;
            document.getElementById('admin-fields').style.display = (type === 'admin') ? 'block' : 'none';
            document.getElementById('user-fields').style.display = (type !== 'admin') ? 'block' : 'none';
            showPage(action === 'reg' ? 'register-page' : 'login-page');
        }

        function processRegistration() {
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;
            const promo = document.getElementById('reg-promotion').value;
            const access = document.getElementById('reg-access-code').value;

            if(portalType === 'admin' && document.getElementById('reg-univ-code').value !== UNIVERSAL_CODE) return alert("Code Admin incorrect");
            if(portalType === 'etudiant' && access !== CODE_ACCES_ETUDIANT) return alert("Code École incorrect");
            if(portalType === 'delegue' && access !== CODE_ACCES_DELEGUE) return alert("Code Délégué incorrect");
            if(phone.length !== 9 || !/^\d{4}[A-Z]{2}$/.test(pass)) return alert("Téléphone (9 chiffres) ou Pass (4 chiffres + 2 MAJ) invalide");

            const newUser = {
                nom: document.getElementById('reg-nom').value, phone, pass, type: portalType,
                mat: document.getElementById('reg-mat').value || 'ADMIN',
                filiere: document.getElementById('reg-filiere').value || 'ADMIN',
                promotion: promo || 'ADMIN'
            };

            database.ref('users').push(newUser).then(() => { alert("Compte créé avec succes !"); showPage('login-page'); });
        }

        function processLogin() {
            const user = usersDB.find(u => u.phone === document.getElementById('log-phone').value && u.pass === document.getElementById('log-pass').value);
            if(user) { currentUser = user; localStorage.setItem('loggedUser', JSON.stringify(user)); showDash(); } else alert("Identifiants non reconnus");
        }

        function showDash() {
            document.getElementById('nav-auth').style.display = 'block';
            if(currentUser.type === 'admin') { showPage('dash-admin'); renderAdminView(); }
            else { 
                showPage('dash-user'); 
                document.getElementById('user-welcome').innerText = "Bonjour, " + currentUser.nom;
                document.getElementById('user-info').innerText = currentUser.promotion + " - " + currentUser.filiere;
                document.getElementById('delegue-area').style.display = (currentUser.type === 'delegue') ? 'block' : 'none'; 
            }
        }

        function renderAdminView() {
            let html = "";
            const promos = ["2ème Promotion", "3ème Promotion"];
            promos.forEach(p => {
                const data = attendanceDB.filter(a => a.promotion === p);
                html += `<div class="promo-section"><h3>📂 ${p}</h3><button class="btn-main btn-pdf" onclick="downloadPDF('${p}')">Exporter PDF Rapport ${p}</button>`;
                ["ISN", "INTS", "CDN"].forEach(f => {
                    const list = data.filter(a => a.filiere === f);
                    html += `<div style="font-size:0.8rem; margin:10px 0; color:#93c5fd; font-weight:600;">Filière ${f}</div><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Nom</th><th>Heure</th><th>📍 GPS</th></tr></thead><tbody>${list.length ? list.map(a => `<tr><td>${a.date}</td><td>${a.nom}</td><td>${a.heure}</td><td>${a.loc}</td></tr>`).join('') : '<tr><td colspan="4">Aucun émargement</td></tr>'}</tbody></table></div>`;
                });
                html += `</div>`;
            });
            document.getElementById('admin-content').innerHTML = html;
        }

        // --- NOUVELLE FONCTION : OUVERTURE CAMÉRA ---
        function startCameraScan() {
            // Afficher la zone caméra
            document.getElementById('reader').style.display = 'block';
            document.getElementById('start-camera-btn').style.display = 'none';

            if(html5QrCodeScanner === null) {
                html5QrCodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            }
            
            html5QrCodeScanner.render(onScanSuccess, onScanError);
        }

        // --- NOUVELLE FONCTION : SUCCÈS DU SCAN CAMÉRA ---
        function onScanSuccess(decodedText, decodedResult) {
            // Un code a été détecté !
            html5QrCodeScanner.clear(); // Arrêter la caméra
            document.getElementById('reader').style.display = 'none';
            document.getElementById('start-camera-btn').style.display = 'block';

            // Nous n'utilisons plus decodedText pour l'instant, on lance juste le GPS
            // pour finaliser la présence.
            processPresenceWithGPS();
        }

        function onScanError(errorMessage) {
            // Erreur de lecture (fréquent si ça bouge, on ignore)
        }

        // --- FONCTION FINALE : GPS + ENREGISTREMENT ---
        function processPresenceWithGPS() {
            const today = new Date().toLocaleDateString();
            
            if(attendanceDB.find(a => a.phone === currentUser.phone && a.date === today)) {
                return alert("Vous avez déjà émargé aujourd'hui !");
            }

            // Démarrage du GPS (📍 LOCALISATION REVIENT ICI)
            navigator.geolocation.getCurrentPosition((position) => {
                const loc = `${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                
                const data = { 
                    nom: currentUser.nom, 
                    filiere: currentUser.filiere, 
                    promotion: currentUser.promotion, 
                    date: today, 
                    phone: currentUser.phone, 
                    heure: new Date().toLocaleTimeString(),
                    loc: loc // GPS ajouté ici
                };
                
                // Envoi à Firebase
                database.ref('attendance').push(data).then(() => { 
                    document.getElementById('scan-success').style.display = 'block'; 
                    setTimeout(() => document.getElementById('scan-success').style.display = 'none', 4000);
                });

            }, () => {
                alert("Erreur : Le GPS est obligatoire pour valider la présence à l'ESIGN.");
            });
        }

        function generateQR(v) { 
            const container = currentUser.type==='admin'?'qr-result':'qr-delegue';
            document.getElementById(container).innerHTML=""; 
            new QRCode(document.getElementById(container), { text: v + "_" + Date.now(), width:120, height:120 }); 
        }

        function downloadPDF(p) {
            const { jsPDF } = window.jspdf; 
            const doc = new jsPDF();
            const data = attendanceDB.filter(a => a.promotion === p);
            doc.setFontSize(16);
            doc.text("RAPPORT DE PRÉSENCE - " + p.toUpperCase(), 14, 15);
            doc.setFontSize(10);
            doc.text("Généré le : " + new Date().toLocaleString(), 14, 22);
            // GPS ajouté dans le PDF
            doc.autoTable({ head: [['Date', 'Nom', 'Filière', 'Heure', 'GPS']], body: data.map(a => [a.date, a.nom, a.filiere, a.heure, a.loc]), startY: 28 });
            doc.save("Rapport de présence_ESIGN_" + p.replace(" ", "_") + ".pdf");
        }
    </script>
</body>
</html>
